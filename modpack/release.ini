; The release: what Install.bat puts into the game (modmgr setup), and what tools/release.py packs.
; mods: enabled in this order (the order patches of one archive chain in, after patch_order); hd_textures only when
; the HD pack is unpacked into modkit\mods\hd.
[release]
name = Rise of Legends Remastered
version = 1.0
mods = core, laa, anisotropic_16x, camera_zoom, hd_textures, mods_tab, hidden_features, hires_shadows, ui_scale,
    smooth_animation, soft_shadows, ssao, sharpen, vibrance
