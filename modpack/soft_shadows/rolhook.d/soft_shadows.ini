; soft_shadows: the shadow on buildings, units, grass, decals and the ground filtered over a box of shadow-map texels
; (2 / 4 / 6 wide for levels 1 / 2 / 3) instead of the game's one tap or bilinear quad; each tap compared against the
; receiving surface's depth under it (native/rolhook/shaderfx.cpp, shadergen.cpp). The "Mods" tab changes the level
; live (rolhook.d\zz_options.ini).
[graphics]
soft_shadows=2
