[mod]
id=camera_zoom
version=0.4
name=Wider camera zoom range
name_ru=Расширенный зум камеры
description_ru=Камера отъезжает дальше (7500 → 11000, расширенный отъезд 8600 → 14000) и подъезжает ближе (2000 → 1500); 12 шагов зума вместо 8, скорость прокрутки на дальнем зуме растёт пропорционально. Правит одну запись в multiplayer_data.big (оригинал хранится в modkit\backup); с rolhook те же значения ставятся живой камере, и их можно менять во вкладке «Моды». С rolhook зум ещё и без отскока: игра переносит скорость прошлого щелчка колеса в следующий, и камера проскакивает цель и пружинит назад. Мод по умолчанию это убирает, силу отскока можно выбрать во вкладке «Моды».

[files]
rolhook.d/camera_zoom.ini=rolhook.d/camera_zoom.ini

[entries]
; archive::entry inside it = replacement file, or patch:<script.py> that edits the original entry
multiplayer_data.big::.\data\gamecamera.xml=patch:patches/gamecamera.py
