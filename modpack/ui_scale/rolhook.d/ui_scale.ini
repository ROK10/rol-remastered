; ui_scale: the interface laid out bigger. rolhook reads BIGS\ui.big, BIGS\multiplayer_data.big, BIGS\scripts.big
; and the campaign files (campaigns\<nation>\<nation>.campaign) from layout_overlay\<layout_scale>\ (variants built by
; modpack\ui_scale\build.py) and, once they are in use, rasterizes the fonts at the scale and keeps magnified
; pictures inside their atlas cells.
; The scale is chosen on the Mods tab (Auto / 100 = as the game / 125 / 150 / 175 / 200) and applies at the game's
; start. 0 = auto: the scale for the height the game runs at, from its profile - 1080 lines 100, 1200 125, 1440 150,
; 1600 175, 2160 200 (rolhook.ini [ui]).
[ui]
layout_scale=0
layout_overlay=modkit\mods\ui_scale
