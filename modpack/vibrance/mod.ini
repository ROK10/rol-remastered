[mod]
id=vibrance
version=0.1
requires=core
name=Vibrance
name_ru=Живость цвета
description_ru=Живость цвета (вибранс) для 3D-сцены боя: блёклые цвета насыщаются заметнее, уже яркие — едва-едва, серое остаётся серым, яркость не меняется. Работает тем же проходом, что и резкость, до свечения и интерфейса: интерфейс не трогается. Уровень (выключена / слабо / средне / сильно) — во вкладке «Моды», меняется сразу, и в идущей игре тоже. По умолчанию «слабо».

