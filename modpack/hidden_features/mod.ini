[mod]
id=hidden_features
version=0.4
name=Hidden graphics features
name_ru=Скрытые функции графики
description_ru=Возвращает то, что разработчики выключили в game_features.xml: «Следы боя на земле» (UseStaticSplats — воронки и подпалины остаются на земле) снова доступны и включаются на ступени качества «Лучшее». Флажок — во вкладке «Моды» (нужны «свои настройки» и перезапуск). «Сглаженный рельеф» (FullResTerrain) мод с версии 0.3 не трогает: он размазывает текстуры земли полосами. Пункт «Огромная (4096)» в «Детализации теней» убран в 0.4: он никогда не работал, движок ограничивает тени 2048 в коде — чёткие тени теперь даёт мод hires_shadows. Правит одну запись в data.big (оригинал хранится в modkit\backup).

[entries]
; archive::entry inside it = replacement file, or patch:<script.py>; bxml entries get patch_bxml(bx)
data.big::.\data\game_features.xml=patch:patches/game_features.py
