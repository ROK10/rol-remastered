; camera_zoom: zoom range for the game camera. rolhook applies it to the live camera when a game starts,
; and the "Mods" tab of the options window changes it (rolhook.d\zz_options.ini overrides these values).
; data\gamecamera.xml carries the same values for when rolhook is not installed.
[camera]
zoom_in=1500
zoom_out=11000
zoom_steps=12
; zoom_spring: how far a wheel step may overshoot and spring back (the zoom carries the speed of the last
; step into the next): 0 none, 1 weak, 2 medium, 3 as the game
zoom_spring=0
