[mod]
id=dev_probe
version=0.1
requires=core
name=Developer probe (diagnostic session)
name_ru=Зонд разработчика (диагностическая сессия)
description_ru=Не для обычной игры: включается на одну игровую сессию, чтобы rolhook записал в probe.log, какой код движка читает нужные значения (аппаратные точки останова) и откуда интерфейс берёт размер экрана. 0.1 — разведка для масштаба интерфейса и LOD: прямоугольник экрана корня раскладки окон и пороги lod_0..2_pixel_size из data\lod.xml. После сессии выключить.

[files]
rolhook.d/dev_probe.ini=rolhook.d/dev_probe.ini
