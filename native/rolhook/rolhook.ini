; rolhook — diagnostics and fixes for Rise of Legends (loaded as ddraw.dll from the game folder).
; This is the everyday profile; tests/ has diagnostic profiles with debug levels.
; Channel levels: off | error | warn | info | debug | trace

[general]
enabled=1
; session folders are created here (relative to the game folder, or absolute)
log_dir=modkit\logs\sessions
; how often buffered lines are written to disk; WARN/ERROR lines are written immediately
flush_ms=250
; engine assert boxes (Abort/Retry/Ignore): ignore = log and continue, ask = show the box
assert_mode=ignore
; write crash.dmp into the session folder if the game crashes
crash_dump=1
; retry IDirect3DTexture9::LockRect without D3DLOCK_DISCARD when the engine misuses the flag
fix_lockrect=0
; seconds between frame / memory summary lines
frame_interval=5
memory_interval=30

[graphics]
; 2..16: upgrade the engine's linear texture filtering to anisotropic (sharper ground/walls at an angle); 0 = off
anisotropy=0
; alpha-to-coverage (NVIDIA): MSAA-smoothed edges of cut-outs (leaves, railings, ornaments) instead of the
; alpha test's stair-steps. 1 = alpha-tested draws without blending, 2 = also the blended ones, 0 = off
atoc=0
; model detail at a distance: the LOD switch sizes in % of data\lod.xml (50 = detailed models twice as far,
; 25 = four times, 0 = always the full model, 100 = as in the game); applied live
lod_thresholds=100
; 1: the game's fullscreen runs as a borderless window over the monitor (instant Alt-Tab, overlays, other monitors);
; the cursor is kept inside the window while the game is in front. Takes effect at the game's start
borderless=0
; shadow map sampling: point = as the engine does (every shadow texel shows as a block), linear = the stored depth is
; interpolated, shadow edges follow a smooth contour (still hard edges, no soft penumbra)
shadow_filter=point
; shadow map resolution: 0 = as the game (its options, but the engine caps them at 2048 whatever they say),
; 4096 / 8192 / 16384 = that size (the cap lifted; 8192 costs ~0.8 GB of video memory, 16384 ~3 GB).
; Takes effect at the game's start
shadow_size=0
; how the shadow map is fitted to the view ("Zoomed-Out Shadows" on the Mods tab), applied live:
;   0 = as the game: a trapezoid over the whole view frustum, the air above the ground and the volume under it
;       included - only ~30% of the map lands on the ground in view
;   1 = only the part of the map's bounding box in view (every visible surface stays inside)
;   2 = only a layer of relief around the look-at point: shadow_fit_margin % of the zoom distance above and below
;       (deep valleys / high cliffs at the screen edges may lose their shadows)
; 1 and 2 also keep the texel grid still while the camera pans (no crawling shadow edges)
shadow_fit=0
shadow_fit_margin=25
; smooth animation ("Smooth Animation" on the Mods tab, applied live): how old (ms) a cached skeleton pose may be
; before a unit gets a fresh one. The game reuses poses up to 66 ms old, so limbs move ~16 times a second while bodies
; glide every frame; 1 = a fresh pose on every frame (units with the same animation at the same time still share one).
; 0 = as the game. With it, the animation clocks also run on through a simulation tick that comes late instead of
; standing at its end for a frame and leaping (every animation stuttered 15 times a second, a mill's sails most
; visibly); anim_clock=0 keeps the engine's clocks even then
anim_pose_ms=0
anim_clock=1
; soft shadows ("Soft Shadows" on the Mods tab, applied live): the shadow on buildings, units, grass, decals and the
; ground tested over a box of shadow-map texels with smoothed edges instead of the game's single tap (the ground's
; bilinear quad), each texel against the receiving surface's depth under it. 0 = as the game, 1 / 2 / 3 = a box 2 / 4 /
; 6 texels wide (with shadow_size=8192 a texel is about half a pixel on screen). The game's shaders are rewritten when
; they are created (shadergen.cpp)
soft_shadows=0
; ambient occlusion ("Ambient Occlusion" on the Mods tab, applied live): soft darkening where buildings stand on
; the ground, in corners, under trees, between units. The scene's depth is drawn a second time into rolhook's own
; buffer and the AO multiplied in before smoke, fire and the interface. 0 = off, 1 / 2 / 3 = radius 60 / 90 / 120 world
; units and darker; ssao_radius (world units) / ssao_intensity (percent, 300 = level 2) override the level's values
ssao=0
; gamma-correct light on buildings and units ("Gamma-Correct Lighting" on the Mods tab, applied live): the sun's falloff
; across a surface as light summed in linear space (gamma 2.2) gives it - the game sums the sun's N.L and the ambient
; in gamma space, so faces turned partly away from the sun come out too dark; full sun and full shade stay as they
; were. 0 = as the game, 1 = on
gamma_light=0
; sharpening and vibrance of the battle scene ("Sharpening" / "Vibrance" on the Mods tab, applied live): one pass
; when the scene is done, before the post-processing and the interface (the interface stays as it is). sharpen: AMD's
; Contrast Adaptive Sharpening - fine detail most, edges without halos, flat areas as they are; 1 / 2 / 3 = amount
; 0.4 / 0.8 / 1.6 (AMD's own sharpness 0 is 1). vibrance: dull colours gain the most saturation, grey stays grey, vivid
; colours little; 1 / 2 / 3 = 0.12 / 0.25 / 0.4. 0 = off
sharpen=0
vibrance=0

[camera]
; The zoom range (zoom_in, zoom_out, zoom_steps) and zoom_spring come from the camera_zoom mod and the Mods tab.
; The zoom animation carries the speed of one wheel step into the next and overshoots the step, springing back.
; zoom_spring: how far a step may overshoot (0 none, 1 weak = 10% of a step, 2 medium = 25%, 3 as the game: up to
; ~60%); applies at once. stop_at_limits=1: at the closest and the farthest zoom the camera stops instead of going
; past and springing back, whatever zoom_spring allows. 0 = as the game
stop_at_limits=1

[debug]
; key that writes the next frame's draw calls to <session>\capture_<frame>.log
; (Num0..Num9, Num*, Num/, F1..F24, a key code, off). Not Scroll Lock: the game locks the camera while it is on,
; and it binds every F key, Pause, Insert and Num+/- itself
capture_key=Num*
; key that saves the frame on screen as <session>\shot_<frame>.png (same key names; off = no key). Off by default:
; Num. is Delete when NumLock is off, and the game's own screenshots land in <profile>\screen_shots anyway
shot_key=off
; Developer probes (probe.log), normally off:
;   watch=0x1464998:4:rw, 0x00fb7bc0:x   up to four hardware breakpoints: address[:length 1|2|4][:rw|w|x]
;                                        (read/write, write, execute); each distinct instruction that hits one
;                                        is logged once with registers and callers, counts at exit / probe key
;   watch_max_hits=3000                  per watch and thread; past it the breakpoint is cleared on that thread
;   ui_probe=1                           log the object the UI layout takes the screen rectangle from;
;                                        2 = also watch that rectangle (who reads the screen size)
;   watch_shadow_matrix=1                watch writes of the shadow map projection (the code that fits the
;                                        shadow map to the camera; frame captures always list the matrix)
;   probe_key=Num/                      hit summary, UI probe again, breakpoints re-set on all threads
;   log_camera=1                         ui.log: the camera's zoom distance, aim, range and tilt whenever
;                                        they change (wheel zoom, its overshoot, the pull back from the extended zoom)
;   log_script_ui=1                      ui.log: the game scripts' window functions (the campaign map's windows are
;                                        placed and sized by scripts): name(arguments) -> result whenever it changes
;   log_sprites=1                        ui.log: every distinct interface picture drawn (texture, texels, screen
;                                        size, where, the code that drew it) once - 100 vs 150 % shows what the
;                                        layouts do not scale (modkit\tools\ui_sprites.py)
;   motion_probe=15, 4                   motion.log: for 4 s from 15 s of the test clock, every unit on screen frame
;                                        by frame - its matrix and pose (modkit\tools\motion.py: how often units move
;                                        and change pose against the frame rate); with it:
;     motion_vertices=0                  matrices only, no vertex copies (the copies cost frames in busy moments)
;     motion_buildings=1                 building parts too (P lines; parts posed on the CPU also as U lines)
;     motion_anim=1                      A lines: each drawn object's animation time and the code that asked
;     motion_source=1                    look for the first unit's (building part's) posed vertices in memory and
;                                        watch them: probe.log names the code that writes them
;     motion_matsrc=alim_mill:371        look for the world matrix of a texture's draw (and vertex count) in memory
;                                        once it moves, watch it: probe.log names the code that moves it
;     motion_xform=1                     X lines: every model's transform as the render copies it (0x00E71AF0)
;   watch_follow=0xE72166:ebx+0x38:4w    an execute breakpoint whose first hit turns into a data watch at register
;   watch_follow_at=11                   + offset, set at this second of the test clock;
;   watch_follow_if=edi+0x10<16 & ...    a hit counts only when the dwords at register + offset meet these
;   watch_deref=0x13E50AC+0x38:4w        a data watch on what a global pointer points at (+ offset), set at
;   watch_deref_at=11                    this second of the test clock once the pointer is set
;   dump_shaders=1                       every shader the effects create, disassembled with its constant table, to
;                                        <session>\shaders\<effect>.<vs|ps>.<n>.txt (each distinct one once), and the
;                                        soft-shadow copies' assembly next to them (modkit\build\native\shadertest.exe
;                                        <that folder> checks the rewrite on them without the game)
;   soft_shadows_plane_bias=0            soft shadows: each texel compared against the fragment's depth, as the game's
;                                        one tap, instead of the surface's under it (lit slopes then shade themselves)
;   gpu_timing=1                         d3d.log: the battle scene, the AO passes and the rest timed on the GPU
;                                        (timestamp queries; works with ssao=0 too)
;   ssao_probe=1                         d3d.log: once, the AO read back - the view depth at the screen's centre against
;                                        the camera's distance, the AO's mean and darkest tenth
;   count_calls=0xEE43A0/6, ...          calls.log: how many times these engine functions run per frame (address /
;   count_window=15, 3                   detour length from modkit\tools\prologue.py; modkit\tools\calls.py)

[ui]
; interface scale in percent (prototype, 100 = off; takes effect at the game's start): the interface is laid out on a
; screen 100/scale times smaller and drawn at full size. filter = point (magnified pieces without seams) | linear
scale=100
filter=point
; interface laid out bigger (the ui_scale mod, scale chosen on the Mods tab; takes effect at the game's start): a game
; file opened for reading comes from <layout_overlay>\<layout_scale>\<same path> when the mod built one there (scaled
; layouts in BIGS\ui.big and multiplayer_data.big). Once it serves one, the fonts are rasterized at the scale and
; magnified pictures are sampled inside their atlas cells. 100 = as the game; 0 = auto: the scale for the height the
; game will run at (the profile's resolution, windowed the window's; the display's at the first start), the nearest
; of 100/125/150/175/200 to height / 9.6 - 1080 lines 100, 1200 125, 1440 150, 1600 175, 2160 200 (core.log says)
layout_scale=100
layout_overlay=

; Automated test runs (modkit\tools\autotest.py) add one more layer, named by the ROLHOOK_EXTRA_INI environment
; variable of the game they start, with a [test] section that is never set here:
;   start=match | first_frame   test clock from the first frame that draws terrain, or from the first frame
;   shots=6, 12                 screenshots at these seconds of the clock -> <session>\shot_<n>_<s>s.png
;   capture=1                   a frame capture of the same frame with each shot
;   wheel=1:10                  mouse wheel notches posted to the game window at a second of the clock (+ = zoom in)
;   quit=13                     end the game at this second (after the shots are written)
;   timeout=180                 or this many seconds after the start when no match came on screen
;   pristine_bigs=data.big      read these archives from modkit\backup\BIGS (without the mods' archive patches)

[textures]
; 1: when <override_dir>\<path inside the archive>.dds exists, load it instead of the archive texture
; (the HD file's own mip chain and pixel format are used)
override=0
override_dir=modkit\mods\hd

[levels]
core=info
files=warn
bigs=info
textures=info
d3d=info
frame=info
memory=info
; options window events (the "Mods" tab)
ui=info
; developer probes ([debug] watch / ui_probe)
probe=info
