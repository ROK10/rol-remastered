; sharpen: the battle scene sharpened by AMD's Contrast Adaptive Sharpening (amount 0.4 / 0.8 / 1.6 for levels
; 1 / 2 / 3) in one pass when the scene is done, before the post-processing and the interface
; (native/rolhook/ssao.cpp, post.cpp). The "Mods" tab changes the level live (rolhook.d\zz_options.ini).
[graphics]
sharpen=2
