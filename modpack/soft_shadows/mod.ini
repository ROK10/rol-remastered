[mod]
id=soft_shadows
version=0.1
requires=core
name=Soft shadows
name_ru=Мягкие тени
description_ru=Тени на зданиях, юнитах, траве и на земле получают мягкий край вместо резкого и ступенчатого. Игра проверяет каждую точку модели по одной точке карты теней, а мод — по квадрату из соседних точек со сглаженными краями: тень плавно переходит в свет при любом положении камеры. Наклонные поверхности при этом не затеняют сами себя, а тени на земле не сдвигаются. Уровень (как в игре / слабо / средне / сильно: край шириной 2, 4 или 6 точек карты теней) — во вкладке «Моды», меняется сразу, и в идущей игре тоже. По умолчанию «средне». Лучше всего смотрится вместе с модом «Чёткие тени» (карта 8192).

