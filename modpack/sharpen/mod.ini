[mod]
id=sharpen
version=0.1
requires=core
name=Sharpening (CAS)
name_ru=Резкость
description_ru=Адаптивная резкость AMD CAS для 3D-сцены боя: мелкие детали текстур, зданий и юнитов становятся чётче, края — без светлых ореолов, ровные места не меняются. Работает одним проходом в конце сцены, до свечения и интерфейса: интерфейс не трогается. Уровень (выключена / слабо / средне / сильно) — во вкладке «Моды», меняется сразу, и в идущей игре тоже. По умолчанию «средне». Стоит около 0,2 мс видеокарты на кадр (вместе с живостью цвета).

[files]
rolhook.d/sharpen.ini=rolhook.d/sharpen.ini
