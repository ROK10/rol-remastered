; rolhook config for test 02 (HD texture override). Installed as <game>\rolhook.ini.
; Channel levels: off | error | warn | info | debug | trace

[general]
enabled=1
log_dir=modkit\logs\sessions
flush_ms=250
assert_mode=ignore
crash_dump=1
fix_lockrect=0
frame_interval=1
memory_interval=5

[graphics]
anisotropy=0

[textures]
override=1
override_dir=modkit\mods\test02

[levels]
core=info
files=info
bigs=debug
textures=debug
d3d=info
frame=info
memory=info
