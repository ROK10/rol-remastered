[mod]
id=ui_scale
version=0.9
requires=core
name=Interface scale
name_ru=Масштаб интерфейса
description_ru=Интерфейс раскладывается крупнее: координаты, размеры и отступы окон, кнопок, надписей и картинок в разметке игры умножаются на масштаб. Все шрифты rolhook растеризует крупнее, поэтому текст чёткий, а не растянутый, и растёт одинаково, откуда бы игра ни брала его размер. Рамки и кнопки из кусков атласа рисуются увеличенными целиком (уголки, края, узоры), а увеличенные картинки берутся строго из своей ячейки атласа, без рамок от соседних. Окна карты кампании (панель справа внизу, окно территории, окна армии, изобретений, городов и героев) описаны в файлах кампаний (campaigns\<нация>\<нация>.campaign) и масштабируются так же; пиксельные константы скриптов кампании, по которым те подгоняют окна и раскладывают сетку армии, — тоже. Мышь, 3D-мир и камера не затрагиваются. Масштаб (Авто / 125 / 150 / 175 / 200%) выбирается во вкладке «Моды» и действует со следующего запуска; по умолчанию «Авто» — по высоте разрешения, в котором запускается игра (из её профиля): до 1080 строк — 100%, 1200 — 125%, 1440 — 150%, 1600 — 175%, 4K — 200%. rolhook читает разметку из готовых вариантов (modkit\mods\ui_scale), файлы игры не меняются. Несколько мелких картинок, которые игра рисует кодом, пока остаются прежнего размера.
; modmgr runs it after every archive rebuild: the variants carry the other mods' patches
post_rebuild=build.py

[files]
rolhook.d/ui_scale.ini=rolhook.d/ui_scale.ini
