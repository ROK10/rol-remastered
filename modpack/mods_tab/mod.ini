[mod]
id=mods_tab
version=0.24
requires=core
name=Mods tab in the options window
name_ru=Вкладка «Моды» в настройках
description_ru=Восьмая вкладка «Моды» в окне настроек игры — на языке установленной игры (английский, немецкий, французский, итальянский, испанский, польский, чешский, русский, японский, китайский; язык берётся из loc.ini при установке, после смены языка игры мод нужно применить заново). Четыре группы. Изображение: анизотропная фильтрация, детализация моделей вдали (пороги LOD), резкость (CAS) и живость цвета (вибранс) — сразу, до интерфейса, HD-текстуры, сглаживание листвы и решёток (ATOC), плавная анимация (позы скелетов каждый кадр вместо ступенек по 66 мс), а также скрытая разработчиками опция «Следы боя на земле» (UseStaticSplats, доступна с модом hidden_features; её хранит сама игра, нужны перезапуск и включённые «свои настройки» на вкладке «Система»). Тени и свет: разрешение теней (2048 / 4096 / 8192, после перезапуска), мягкие тени, чёткость теней при отдалении камеры, затенение SSAO, гамма-корректный свет на зданиях и юнитах. Камера: предел отдаления, число шагов и отскок зума. Окно и интерфейс: полный экран без рамки и масштаб интерфейса (с модом ui_scale: «Авто» под разрешение или 125–200%), оба после перезапуска. rolhook заполняет вкладку текущими значениями и применяет выбор по «Применить»/«ОК» сразу, даже посреди партии (HD-текстуры — со следующей карты); то, что отличается от значений модов, хранится в rolhook.d\zz_options.ini. Правит одну запись в multiplayer_data.big (оригинал хранится в modkit\backup); ширина вкладок подогнана под их названия на языке игры.
; written by rolhook, not by the mod manager: kept when the mod is disabled, removed by uninstall-all
user_files=rolhook.d/zz_options.ini

[entries]
; archive::entry inside it = replacement file, or patch:<script.py> that edits the original entry
multiplayer_data.big::.\data\optionswin.xml=patch:patches/optionswin.py
