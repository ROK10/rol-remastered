[mod]
id=smooth_animation
version=0.2
requires=core
name=Smooth animation
name_ru=Плавная анимация
description_ru=Убирает две причины рывков в анимации. Первая: игра пересчитывает скелет юнита не чаще раза в 66 мс — новая поза берётся из общего кэша, пока старой нет 66 мс, поэтому руки и ноги двигались ступеньками, около 16 раз в секунду, хотя сам юнит перемещается плавно. Мод снижает этот порог до 1 мс: поза обновляется каждый кадр, юниты с одинаковой анимацией по-прежнему делят одну позу. Вторая: часы, по которым идут все анимации (юниты, здания, флаги), на каждом такте симуляции — 15 раз в секунду — замирали на кадр и потом прыгали на два. Особенно это было видно на вращающихся частях зданий, например на тимониевой шахте алинов. Теперь часы идут ровно. Меняется только картинка: симуляция и геймплей не затрагиваются. Включает галочку «Плавная анимация» на вкладке «Моды» (мод mods_tab), там её можно выключить и включить прямо в игре.

[files]
rolhook.d/smooth_animation.ini=rolhook.d/smooth_animation.ini
