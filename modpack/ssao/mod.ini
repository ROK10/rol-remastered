[mod]
id=ssao
version=0.1
requires=core
name=Ambient occlusion (SSAO)
name_ru=Затенение в углах (SSAO)
description_ru=Мягкое затенение там, куда меньше попадает рассеянный свет: у основания зданий на земле, в углах и складках, под деревьями, между юнитами. Игра такого не рисует, поэтому постройки кажутся «наклеенными» на землю. Мод снимает глубину сцены и по ней затемняет закрытые места; дым, огонь, взрывы, кольца выделения и интерфейс не затемняются. Уровень (выключено / слабо / средне / сильно) — во вкладке «Моды», меняется сразу, и в идущей игре тоже. По умолчанию «средне». Стоит около 0,5 мс видеокарты на кадр.

[files]
rolhook.d/ssao.ini=rolhook.d/ssao.ini
