; dev_probe 0.1 — one diagnostic session for the UI-scale and LOD work (enable, play, disable).
; Results: <session>\probe.log, plus capture_<frame>.log for each Num * press.

[debug]
; the object the UI layout takes the screen rectangle from, and every instruction that reads the rectangle
ui_probe=2
; LOD thresholds of data\lod.xml in the engine's LOD manager (0x1464968 + 0x30/0x34/0x38): who reads them
watch=0x1464998:4:rw, 0x146499c:4:rw, 0x14649a0:4:rw
watch_max_hits=3000
probe_key=Num/

[levels]
probe=info
