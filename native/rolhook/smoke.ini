; config used by smoke.exe (copied next to it as rolhook.ini)
[general]
enabled=1
log_dir=logs
flush_ms=100
assert_mode=ignore
crash_dump=1
fix_lockrect=0
frame_interval=1
memory_interval=1

[textures]
override=1
override_dir=override_smoke

[levels]
core=trace
files=debug
bigs=debug
textures=trace
d3d=debug
frame=debug
memory=info

[graphics]
atoc=1

[debug]
capture_at=5
