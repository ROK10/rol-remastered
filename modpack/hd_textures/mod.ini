[mod]
id=hd_textures
version=0.2
requires=core
name=HD textures
name_ru=HD-текстуры
description_ru=rolhook подменяет текстуры игры файлами из modkit\mods\hd (DDS с полной цепочкой мипов, формат как у оригинала). Сам набор собирается скриптами modkit\hd (hd_full.py) и в репозиторий не входит. Фазы: рельеф, здания, юниты, деревья, ландшафтные объекты, эффекты и карта кампании (цвет ×4 до 4096 без швов между тайлами, нормали и границы регионов ×2).

[files]
rolhook.d/hd_textures.ini=rolhook.d/hd_textures.ini
