[mod]
id=hires_shadows
version=0.1
requires=core
name=High-resolution shadows
name_ru=Чёткие тени
description_ru=Движок рисует тени в карту 2048×2048 на всё поле зрения и не даёт поднять её выше (пункт «Огромная» в настройках на деле не работал): тени деревьев и зданий на земле выходят крупными квадратами. Мод снимает этот потолок в коде игры и делает карту 8192×8192 — в тенях листвы видна форма листьев — и читает её со сглаживанием, без лесенки по краям. Около 0,8 ГБ видеопамяти, на частоту кадров у RTX 4080 не влияет. Разрешение (как в игре / 4096 / 8192) — во вкладке «Моды», меняется после перезапуска игры.

[files]
rolhook.d/hires_shadows.ini=rolhook.d/hires_shadows.ini
